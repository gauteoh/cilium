apiVersion: v1
kind: ConfigMap
metadata:
  name: http-ext-auth
  namespace: gateway-conformance-infra
data:
  http-ext-auth.js: |
    const Http = require("http");

    const tokens = {
      "token1": "user1",
      "token2": "user2",
      "token3": "user3"
    };

    const server = new Http.Server((req, res) => {
      const authorization = req.headers["authorization"] || "";
      const extracted = authorization.split(" ");
      const user = extracted.length === 2 && extracted[0] === "Bearer"
        ? tokens[extracted[1]]
        : undefined;

      // Drain the request body before responding. Without this, implementations
      // that forward the request body to the auth server (forwardBody) can
      // deadlock: the auth server stops reading while the proxy is still
      // writing, filling the TCP receive buffer and stalling both sides.
      req.resume();
      req.on("end", () => {
        if (user !== undefined) {
          res.writeHead(200, { "x-current-user": user });
        } else {
          res.writeHead(403);
        }
        res.end();
      });
    });

    const port = process.env.PORT || 9002;
    server.listen(port);
    console.log(`starting HTTP ext-auth server on: ${port}`);

    process.on("SIGTERM", () => {
      server.close(() => process.exit(0));
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-ext-auth
  namespace: gateway-conformance-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-ext-auth
  template:
    metadata:
      labels:
        app: http-ext-auth
    spec:
      containers:
      - name: http-ext-auth
        command:
        - node
        - /usr/src/app/http-ext-auth.js
        image: node:19-bullseye
        ports:
        - containerPort: 9002
        volumeMounts:
        - name: http-ext-auth
          mountPath: /usr/src/app
        readinessProbe:
          httpGet:
            httpHeaders:
            - name: authorization
              value: "Bearer token1"
            port: 9002
      volumes:
      - name: http-ext-auth
        configMap:
          name: http-ext-auth
---
apiVersion: v1
kind: Service
metadata:
  name: http-ext-auth
  namespace: gateway-conformance-infra
spec:
  selector:
    app: http-ext-auth
  ports:
  - protocol: TCP
    port: 9002
    targetPort: 9002
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-ext-auth
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /http-ext-auth
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: http-ext-auth
          port: 9002
        http:
          allowedResponseHeaders:
          - x-current-user
    backendRefs:
    - name: infra-backend-v1
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-ext-auth-forward-body
  namespace: gateway-conformance-infra
spec:
  parentRefs:
  - name: same-namespace
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /http-ext-auth-forward-body
    filters:
    - type: ExternalAuth
      externalAuth:
        protocol: HTTP
        backendRef:
          name: http-ext-auth
          port: 9002
        http:
          allowedResponseHeaders:
          - x-current-user
        forwardBody:
          maxSize: 1024
    backendRefs:
    - name: infra-backend-v1
      port: 8080
