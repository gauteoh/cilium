    google.golang.org/protobuf v1.33.0/go.mod h1:c6P6GXX6sHbq/GpV6MGZEdwhWPcYBgnhAHhKbcUYpos=
  main.go: |
    package main

    import (
    	"context"
    	"fmt"
    	"log"
    	"net"
    	"net/http"
    	"os"
    	"os/signal"
    	"strings"
    	"syscall"

    	envoy_api_v3_core "github.com/envoyproxy/go-control-plane/envoy/config/core/v3"
    	envoy_service_auth_v3 "github.com/envoyproxy/go-control-plane/envoy/service/auth/v3"
    	"google.golang.org/genproto/googleapis/rpc/code"
    	"google.golang.org/genproto/googleapis/rpc/status"
    	"google.golang.org/grpc"
    )

    var users = map[string]string{
    	"token1": "user1",
    	"token2": "user2",
    	"token3": "user3",
    }

    type authServer struct{}

    var _ envoy_service_auth_v3.AuthorizationServer = &authServer{}

    func (s *authServer) Check(
    	_ context.Context,
    	req *envoy_service_auth_v3.CheckRequest,
    ) (*envoy_service_auth_v3.CheckResponse, error) {
    	authorization := req.Attributes.Request.Http.Headers["authorization"]
    	log.Println(authorization)

    	extracted := strings.Fields(authorization)
    	if len(extracted) == 2 && extracted[0] == "Bearer" {
    		if user, ok := users[extracted[1]]; ok {
    			return &envoy_service_auth_v3.CheckResponse{
    				HttpResponse: &envoy_service_auth_v3.CheckResponse_OkResponse{
    					OkResponse: &envoy_service_auth_v3.OkHttpResponse{
    						Headers: []*envoy_api_v3_core.HeaderValueOption{
    							{
    								Header: &envoy_api_v3_core.HeaderValue{
    									Key:   "x-current-user",
    									Value: user,
    								},
    								AppendAction: envoy_api_v3_core.HeaderValueOption_OVERWRITE_IF_EXISTS_OR_ADD,
    							},
    						},
    					},
    				},
    				Status: &status.Status{
    					Code: int32(code.Code_OK),
    				},
    			}, nil
    		}
    	}

    	return &envoy_service_auth_v3.CheckResponse{
    		Status: &status.Status{
    			Code: int32(code.Code_PERMISSION_DENIED),
    		},
    	}, nil
    }

    func main() {
    	lis, err := net.Listen("tcp", fmt.Sprintf(":%d", 9002))
    	if err != nil {
    		log.Fatalf("failed to listen: %v", err)
    	}

    	gs := grpc.NewServer()
    	envoy_service_auth_v3.RegisterAuthorizationServer(gs, &authServer{})

    	log.Printf("starting gRPC auth server on: %d\n", 9002)

    	go func() {
    		if err := gs.Serve(lis); err != nil {
    			log.Fatalf("failed to serve: %v", err)
    		}
    	}()

    	httpSrv := &http.Server{Addr: ":8080"}
    	http.HandleFunc("/healthz", func(w http.ResponseWriter, r *http.Request) {
    		w.WriteHeader(http.StatusOK)
    	})

    	go func() {
    		quit := make(chan os.Signal, 1)
    		signal.Notify(quit, syscall.SIGTERM, syscall.SIGINT)
    		<-quit
    		gs.GracefulStop()
    		httpSrv.Shutdown(context.Background())
    	}()

    	if err := httpSrv.ListenAndServe(); err != nil && err != http.ErrServerClosed {
    		log.Fatalf("failed to serve health check: %v", err)
    	}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-ext-auth
  namespace: gateway-conformance-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grpc-ext-auth
  template:
    metadata:
      labels:
        app: grpc-ext-auth
    spec:
      containers:
        - name: golang-app-container
          command:
            - sh
            - "-c"
            - "cp -a /app /app-live && cd /app-live && go build -o /tmp/ext-auth . && exec /tmp/ext-auth"
          image: golang:1.21.3-alpine
          ports:
            - containerPort: 9002
            - containerPort: 8080
          volumeMounts:
            - name: grpc-ext-auth
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - name: grpc-ext-auth
          configMap:
            name: grpc-ext-auth
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-ext-auth
  namespace: gateway-conformance-infra
spec:
  selector:
    app: grpc-ext-auth
  ports:
    - protocol: TCP
      port: 9002
      targetPort: 9002
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-ext-auth
  namespace: gateway-conformance-infra
spec:
  parentRefs:
    - name: same-namespace
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-ext-auth
      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: GRPC
            backendRef:
              name: grpc-ext-auth
              port: 9002
            grpc: {}
      backendRefs:
        - name: infra-backend-v1
          port: 8080
